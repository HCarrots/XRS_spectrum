# Conda environment for Linux beamline workstations.
#   conda env create -f environment.yml
#   conda activate xrs
#
# Keep this package list synchronized with pixi.toml [dependencies].
# `python run_xrs.py check config.yaml` reports dependency drift.
name: xrs
channels:
  - conda-forge
dependencies:
  - python >=3.14,<3.15
  - pip
  - numpy >=2.5.3,<3
  - scipy >=1.18.1,<2
  - matplotlib >=3.11.2,<4
  - pandas >=3.0.5,<4
  - h5py >=3.16.0,<4
  - scikit-image >=0.26.0,<0.27
  - pyyaml >=6.0.3,<7
  - ruamel.yaml >=0.19.1,<0.20
  - pytest >=9.1.1,<10
  # Conda-forge SciPy targets OpenBLAS. Mixing an MKL libblas variant can make
  # scipy.optimize.curve_fit (MINPACK) crash during Windows delay loading with
  # 0xC06D007F, before Python can catch an exception. Pin OpenBLAS explicitly.
  - libblas=*=*openblas
