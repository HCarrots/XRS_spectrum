# ============================================================================
# XRS spectrum processing configuration
# Empty values (null or []) are requested interactively and written back here.
# Use --no-ui only after all required values and ROI files are available.
# ============================================================================

# Data locations
data:
  # Beamtime data root. Example: /hepsdatafs/ID33/202504/Data/GID33-250416-01/
  root: null
  raw_subdir: raw
  processed_subdir: processed

# Elastic scans used to establish ROI geometry and fit elastic centers.
elastic:
  # All configured scans are normalized, concatenated, and fitted.
  scan_ids: []
  divide_by_i0: true
  i0_pv: D_SiC_I_A
  # null enables automatic PV detection.
  energy_pv: null

  # regular = rectangular TSV geometry; auto = segmented HDF5 geometry.
  roi_mode: null

  regular_files:
    lambda: null      # Example: roi/roi_lambda.txt
    minipix: null     # Example: roi/roi_minipix.txt

  # Versioned irregular ROI geometry.
  auto_files:
    lambda: null      # Example: roi/auto_ROI_lambda.h5
    minipix: null     # Example: roi/auto_ROI_minipix.h5

  # Legacy center tables accepted as migration inputs.
  auto_centers:
    lambda: null      # Example: roi/auto_ROI_lambda.txt
    minipix: null     # Example: roi/auto_ROI_minipix.txt

  auto_params:
    smooth_sigma: 2.0
    threshold_tightness: 1.0
    min_area: 20
    on_roi_failure: warn       # warn or error

  # Relative-intensity filtering and regular-ROI adaptation.
  use_filter: true
  filter_value: 0.15
  auto_adjust: false
  roi_size: 30

  fit:
    e_lowlim: 9.67
    e_highlim: 9.69
    max_fwhm_ev: 2.0
    min_r_squared: 0.8

# Inelastic XRS scans.
xrs:
  scan_ids: []
  divide_by_i0: true
  i0_pv: D_SiC_I_A
  energy_pv: null
  remove_i0_glitches: true
  exclude_scans: []

# Momentum-transfer calculation.
q:
  # Module order: VB, VU, VD, HB, HL, HR.
  module_angles_deg: []
  # as_before, nominal, or fitted
  elastic_energy_source: as_before

# Interpolation and combination.
sum:
  modules: []
  q_range: [0, 10]
  exclude_rois: []
  energy_step_ev: 0.2

# Output files.
output:
  filename: null
  # combined, per_module, or per_crystal
  mode: combined

# User interface and QC figures.
ui:
  check_crystal: []
  dpi: 150
